name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: los tests no necesitan el binario de Electron
      - run: npm ci --ignore-scripts

      - name: Comprobar sintaxis
        shell: bash
        run: |
          for f in main.js preload.js src/*.js renderer/renderer.js test/*.js web/*.js web/public/*.js; do
            node --check "$f"
          done

      - run: npm test
